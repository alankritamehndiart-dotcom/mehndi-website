
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#350b19">
  <title>Mehndi Gallery | Alankrita Mehndi Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html">ALANKRITA<span>MEHNDI ART</span></a>
    <a class="nav-book" href="https://wa.me/919129824138">Book Now ↗</a>
  </header>

  <main>
    <section class="gallery-section section">
      <p class="eyebrow">OUR COLLECTION</p>
      <h2>Mehndi <em>Masterpieces</em></h2>
      <p class="section-copy">Explore our designs. Tap any photograph to view it larger.</p>

      <div class="gallery-grid">
        <figure class="gallery-tile"><img src="Premium.bridal.style.JPG" alt="Premium bridal mehndi"><figcaption>Premium Bridal</figcaption></figure>
        <figure class="gallery-tile"><img src="Bridal.style.JPG" alt="Bridal mehndi"><figcaption>Bridal Elegance</figcaption></figure>
        <figure class="gallery-tile"><img src="Arabic.style.JPG" alt="Arabic mehndi"><figcaption>Arabic Artistry</figcaption></figure>
        <figure class="gallery-tile"><img src="Indian.style.JPG" alt="Indian mehndi"><figcaption>Indian Tradition</figcaption></figure>
        <figure class="gallery-tile"><img src="Mandala.style.JPG" alt="Mandala mehndi"><figcaption>Mandala Magic</figcaption></figure>
      </div>

      <a class="button button-gold" href="index.html" style="margin-top:35px">← Back to Home</a>
      <a class="button button-outline" href="https://wa.me/919129824138" style="margin-top:15px;background:#350b19;color:#fff">Book Your Mehndi ↗</a>
    </section>
  </main>

  <footer class="footer">
    <a class="brand" href="index.html">ALANKRITA<span>MEHNDI ART</span></a>
    <p>Art on your hands. Memories in your heart.</p>
  </footer>

  <script>
    const tiles = [...document.querySelectorAll('.gallery-tile')];
    const viewer = document.createElement('div');
    viewer.className = 'lightbox';
    viewer.innerHTML = '<button class="lightbox-close" aria-label="Close">×</button><button class="lightbox-prev" aria-label="Previous">‹</button><img alt=""><button class="lightbox-next" aria-label="Next">›</button><p></p>';
    document.body.appendChild(viewer);

    const picture = viewer.querySelector('img');
    const title = viewer.querySelector('p');
    let index = 0;

    function show(i) {
      index = (i + tiles.length) % tiles.length;
      picture.src = tiles[index].querySelector('img').src;
      picture.alt = tiles[index].querySelector('img').alt;
      title.textContent = tiles[index].querySelector('figcaption').textContent;
    }

    function open(i) {
      show(i);
      viewer.classList.add('open');
      document.body.classList.add('lightbox-open');
    }

    function close() {
      viewer.classList.remove('open');
      document.body.classList.remove('lightbox-open');
    }

    tiles.forEach((tile, i) => tile.addEventListener('click', () => open(i)));
    viewer.querySelector('.lightbox-close').addEventListener('click', close);
    viewer.querySelector('.lightbox-prev').addEventListener('click', () => show(index - 1));
    viewer.querySelector('.lightbox-next').addEventListener('click', () => show(index + 1));
    viewer.addEventListener('click', e => { if (e.target === viewer) close(); });
    document.addEventListener('keydown', e => {
      if (!viewer.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') show(index - 1);
      if (e.key === 'ArrowRight') show(index + 1);
    });
  </script>
</body>
</html>
