
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mehndi Gallery | Alankrita Mehndi Art</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html">ALANKRITA <span>MEHNDI ART</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="whatsapp.html">Book</a>
    </nav>
  </header>

  <section class="page-hero">
    <p class="eyebrow">THE ARTWORK COLLECTION</p>
    <h1>Every detail, <em>beautiful.</em></h1>
    <p>Tap any photo to enlarge it. Use the arrows to explore the collection.</p>
  </section>

  <section class="section">
    <div class="home-gallery">
      <button class="gallery-tile tile-tall" data-full="Premium.bridal.style.JPG" aria-label="View premium bridal design"><img src="Premium.bridal.style.JPG" alt="Premium bridal mehndi"></button>
      <button class="gallery-tile" data-full="Bridal.style.JPG" aria-label="View bridal design"><img src="Bridal.style.JPG" alt="Bridal mehndi"></button>
      <button class="gallery-tile" data-full="Arabic.style.JPG" aria-label="View Arabic design"><img src="Arabic.style.JPG" alt="Arabic mehndi"></button>
      <button class="gallery-tile" data-full="Indian.style.JPG" aria-label="View Indian design"><img src="Indian.style.JPG" alt="Indian mehndi"></button>
      <button class="gallery-tile" data-full="Mandala.style.JPG" aria-label="View mandala design"><img src="Mandala.style.JPG" alt="Mandala mehndi"></button>
    </div>
    <div class="center"><a class="button gold-button" href="whatsapp.html">BOOK YOUR DESIGN ↗</a></div>
  </section>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" aria-label="Close image">&times;</button>
    <button class="lightbox-prev" aria-label="Previous image">‹</button>
    <img id="lightbox-image" src="" alt="Enlarged mehndi artwork">
    <button class="lightbox-next" aria-label="Next image">›</button>
    <p class="lightbox-hint">TAP OUTSIDE OR × TO CLOSE</p>
  </div>

  <div class="floating-social">
    <a class="float-button wa" href="whatsapp.html" aria-label="WhatsApp">WA</a>
    <a class="float-button ig" href="instagram.html" aria-label="Instagram">IG</a>
    <a class="float-button yt" href="youtube.html" aria-label="YouTube">YT</a>
  </div>
  <footer><a class="brand" href="index.html">ALANKRITA <span>MEHNDI ART</span></a><p>Artistry that stays with you.</p></footer>
</body>
</html>
